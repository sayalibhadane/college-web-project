<!DOCTYPE html>
<html>
    <head>
        <title>College Events Registration</title>
        <link rel="stylesheet" href="collegeevent.css">
    </head>
    <body>
        <div class="form-container">
            <h1>College Events Registration</h1>
        <hr>
        <form>
        <br>
        <label><b>Student Name:</b></label>
        <input type="text" name="student name:" placeholder="student name" size="10" required>
        <br><br>
        <label><b>Student ID:</b></label>
        <input type="text" name="Student ID:" placeholder="student ID" size="10" required>
        <br><br>
        <label><b>Email ID:</b></label> 
        <input type="text" name="Email ID:" placeholder="Email ID" size="10" required>
        <br><br>
        <label><b>Mobile no.</b></label> 
        <div class="mobile">
            <select>
                <option>+91</option> 
                <option>+1</option>
                <option>+44</option>
            </select>
        <input type="tel"  placeholder="enter 10 digit no" maxlength="10"  pattern="[0-9]{10}" required>
        </div>
        <br><br>
        <label><b>Course:</b></label>
        <select required>
            <option value="">selecte cource</option>
            <option>BCA</option>
            <option value="BBA">BBA</option>
            <option value="MSC">MSC</option>
            <option value="B.Tec">B.Tec</option>
        </select>
        <br><br>
        <label><b>Year:</b></label>
        <select required>
            <option value=""></option>
            <option>fist year</option>
            <option>second year</option>
            <option>last year</option>
        </select>
        <br><br>
        <label><b>Select Events:</b></label>
        <div class="events">
            <input type="radio" name="event" required>quiz<br>
            <input type="radio" name="event" required>postar presentation<br>
            <input type="radio" name="event" required>Coding competition<br>
            <input type="radio" name="event" required>Debate<br>
        </div>
        <label>Participation Type:</label>
        <div class="Participation">
        <input type="radio" name="Participation" required>Individual
        <input type="radio" name="Participation" required>Team
        </div>
        <label>Team Name:</label>
        <input type="text" placeholder="Enter Team name">
        <br><br>
        <label>Previous Experience:</label>
        <div class="Experience">
            <input type="radio" name="experience" value="yes" required>yes
            <input type="radio" name="experience" value="no" required>No
        </div>
        <label>Skills:</label>
        <input type="text" placeholder="Enter your Skills">
        <label><b>Event Date:</b></label>
        <input type="date" required>
        <br><br>

        <label><b>Gender:</b></label>
        <div class="Gender">
            <input type="radio" name="Gender" required>male
            <input type="radio" name="Gender" required>female
            <input type="radio" name="Gender" required>other
        </div>
        <br><br>
        <label><b>Address:</b></label>
        <br>
        <textarea placeholder="enter your Address" rows="4" required></textarea>
<br><br>
        <label><b>Upload Photo:</b></label>
        <input type="file" accept="image/*">
        <div class="terms">
            <input type="checkbox" required>
            I agree to the terms and conditions.
        </div>
<br><br>
        <div class="buttons">
            <button type="submit">REGISTRATION</button>
            <button type="reset">RESET</button>
        </div>
    </form>
    </body>
</html>
